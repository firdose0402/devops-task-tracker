<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - DevOps Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🚀 DevOps Task Tracker</span>
            <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="row text-center mb-4" id="stats-container">
            <div class="col-md-3 mb-2"><div class="card p-3 bg-white shadow-sm"><h5>Total Tasks</h5><h2 id="stat-total">0</h2></div></div>
            <div class="col-md-3 mb-2"><div class="card p-3 bg-warning text-dark shadow-sm"><h5>Pending</h5><h2 id="stat-pending">0</h2></div></div>
            <div class="col-md-3 mb-2"><div class="card p-3 bg-info text-white shadow-sm"><h5>In Progress</h5><h2 id="stat-in-progress">0</h2></div></div>
            <div class="col-md-3 mb-2"><div class="card p-3 bg-success text-white shadow-sm"><h5>Completed</h5><h2 id="stat-completed">0</h2></div></div>
        </div>

        <div class="card p-3 mb-4 shadow-sm">
            <h5>Project Execution Progress</h5>
            <div class="progress" style="height: 25px;">
                <div id="progress-bar" class="progress-bar bg-success progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;">0%</div>
            </div>
        </div>

        <div class="row mb-3 g-2">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="Search tasks by title or description..." onkeyup="filterTasks()">
            </div>
            <div class="col-md-3">
                <select id="filterStatus" class="form-select" onchange="filterTasks()">
                    <option value="All">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
            </div>
            <div class="col-md-3">
                <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="openCreateModal()">➕ Add Task</button>
            </div>
        </div>

        <div class="row" id="taskList"></div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Create Task</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <input type="hidden" id="taskId">
                        <div class="mb-3">
                            <label class="form-label">Task Title</label>
                            <input type="text" id="taskTitle" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="taskDesc" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Priority</label>
                            <select id="taskPriority" class="form-select">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Status</label>
                            <select id="taskStatus" class="form-select">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Due Date</label>
                            <input type="date" id="taskDueDate" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Save Task</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allTasks = [];
        const taskModal = new bootstrap.Modal(document.getElementById('taskModal'));

        async function fetchTasks() {
            const res = await fetch('/api/tasks');
            const data = await res.json();
            allTasks = data.tasks;

            // Render Statistics
            document.getElementById('stat-total').innerText = data.stats.total;
            document.getElementById('stat-pending').innerText = data.stats.pending;
            document.getElementById('stat-in-progress').innerText = data.stats.in_progress;
            document.getElementById('stat-completed').innerText = data.stats.completed;
            document.getElementById('progress-bar').style.width = data.stats.progress_pct + '%';
            document.getElementById('progress-bar').innerText = data.stats.progress_pct + '%';

            filterTasks();
        }

        function filterTasks() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('filterStatus').value;
            const container = document.getElementById('taskList');
            container.innerHTML = '';

            allTasks.forEach(t => {
                if (statusFilter !== 'All' && t.status !== statusFilter) return;
                if (!t.title.toLowerCase().includes(query) && !t.description.toLowerCase().includes(query)) return;

                const badgeColor = t.status === 'Completed' ? 'success' : (t.status === 'In Progress' ? 'info' : 'warning');
                const priorityColor = t.priority === 'High' ? 'danger' : (t.priority === 'Medium' ? 'warning' : 'secondary');

                container.innerHTML += `
                    <div class="col-md-4 mb-3">
                        <div class="card shadow-sm h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-${badgeColor}">${t.status}</span>
                                    <span class="badge bg-${priorityColor}">Priority: ${t.priority}</span>
                                </div>
                                <h5 class="card-title">${t.title}</h5>
                                <p class="card-text text-muted">${t.description || 'No description provided.'}</p>
                                <p class="card-text"><small class="text-muted">📅 Due: ${t.due_date || 'N/A'}</small></p>
                                <hr>
                                <div class="d-flex justify-content-between">
                                    <button class="btn btn-sm btn-outline-secondary" onclick="openEditModal(${JSON.stringify(t).replace(/\"/g, '&quot;')})">✏️ Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteTask(${t.id})">🗑️ Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function openCreateModal() {
            document.getElementById('taskForm').reset();
            document.getElementById('taskId').value = '';
            document.getElementById('modalTitle').innerText = 'Create Task';
        }

        function openEditModal(task) {
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDesc').value = task.description;
            document.getElementById('taskPriority').value = task.priority;
            document.getElementById('taskStatus').value = task.status;
            document.getElementById('taskDueDate').value = task.due_date || '';
            document.getElementById('modalTitle').innerText = 'Edit Task';
            taskModal.show();
        }

        document.getElementById('taskForm').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const payload = {
                title: document.getElementById('taskTitle').value,
                description: document.getElementById('taskDesc').value,
                priority: document.getElementById('taskPriority').value,
                status: document.getElementById('taskStatus').value,
                due_date: document.getElementById('taskDueDate').value
            };

            const url = id ? `/api/tasks/${id}` : '/api/tasks';
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                taskModal.hide();
                fetchTasks();
            } else {
                const err = await res.json().catch(() => ({ error: 'Unknown error' }));
                alert(err.error || 'Failed to save task');
            }
        };

        async function deleteTask(id) {
            if (confirm("Are you sure you want to delete this task?")) {
                const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (res.ok) fetchTasks();
            }
        }

        window.onload = fetchTasks;
    </script>
</body>
</html>
